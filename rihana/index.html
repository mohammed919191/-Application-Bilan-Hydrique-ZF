<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff7aa8">
  <meta name="color-scheme" content="light">
  <meta name="description" content="مدرسة ريحانة: موقع تعليمي للأطفال لتعلّم العربية والرياضيات والفرنسية والإنجليزية مع معلمة صوتية ذكية">
  <title>مدرسة ريحانة</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button id="homeBtn" class="icon-btn" aria-label="الرئيسية">🏠</button>
    <div class="brand">🌸 مدرسة ريحانة</div>
    <div class="pills"><span class="pill" id="stars">⭐ 0</span><span class="pill" id="clock">⏱️ 00:00</span></div>
    <button id="parentBtn" class="icon-btn" aria-label="ركن الوالدين">⚙️</button>
  </header>

  <section class="teacher-row">
    <button id="teacher" class="teacher" aria-label="المعلمة سلمى">👩‍🏫</button>
    <div id="bubble" class="bubble">مرحبًا!</div>
    <button id="repeatBtn" class="icon-btn" aria-label="أعيدي">🔊</button>
  </section>

  <div id="voiceNote" class="voice-note" hidden></div>
  <main id="main"></main>

  <div id="fx"></div>
  <div id="toast"></div>

  <div id="start" class="overlay">
    <div class="start-card">
      <div class="start-emo">👩‍🏫🌸</div>
      <h1>مرحبًا يا <span id="startName">ريحانة</span>!</h1>
      <p>أنا المعلمة سلمى، هيا نتعلّم ونلعب معًا 🎈</p>
      <button id="startBtn" class="btn big">▶ هيا نبدأ</button>
      <small>🔊 ارفعي صوت الجهاز</small>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
